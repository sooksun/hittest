<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ประกาศเลื่อนวันที่ประเมิน HIT Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#eef4ff;--bg2:#ffffff;--accent:#0b5bb5;--text:#102033;}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Kanit","Noto Sans Thai",Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top left,#f4eaff 0,#fff 35%,#eef4ff 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
    .page{width:min(1180px,100%);text-align:center;}
    .notice{display:inline-flex;gap:.5rem;align-items:center;margin-bottom:14px;padding:10px 18px;border-radius:999px;background:#fff;box-shadow:0 8px 28px rgba(15,55,110,.12);font-weight:700;color:var(--accent);}
    .card{background:rgba(255,255,255,.88);border-radius:26px;padding:18px;box-shadow:0 18px 55px rgba(20,40,80,.16);border:1px solid rgba(255,255,255,.8);}
    img{display:block;width:900px;max-width:100%;height:auto;border-radius:16px;margin:0 auto;}
    .caption{margin-top:14px;font-size:clamp(16px,2vw,22px);font-weight:700;line-height:1.5;}
    .caption span{color:#c0392b;}
    @media (max-width:640px){body{padding:12px}.card{padding:9px;border-radius:18px}img{border-radius:10px}.notice{font-size:14px}}
  </style>
</head>
<body>
  <main class="page" aria-label="ประกาศเลื่อนวันที่ประเมิน HIT Test">
    <div class="notice">ประกาศเลื่อนวันที่ HIT-1</div>
    <section class="card">
      <img src="landing.png" alt="ประกาศ สพฐ. กำหนดประเมินการอ่านภาษาไทย HIT Test โดยเลื่อน HIT-1 เป็นวันที่ 18-30 มิถุนายน 2569">
    </section>
    <div class="caption">HIT-1 เปลี่ยนเป็น <span>18-30 มิถุนายน 2569</span> รายละเอียดอื่นคงเดิม</div>
  </main>
</body>
</html>
